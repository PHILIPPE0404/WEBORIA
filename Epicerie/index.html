<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Épicerie Gourmet — Épicerie Fine & Produits d'Exception</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* --- VARIABLES & RESET --- */
    :root {
      --bg-dark: #12100E;
      --bg-card: #1A1715;
      --bg-card-hover: #24201D;
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-dark: #AA820A;
      --terracotta: #C86D51;
      --olive: #5B6B46;
      --text-light: #F4F1EA;
      --text-muted: #A39D93;
      --border-color: rgba(212, 175, 55, 0.2);
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Montserrat', sans-serif;
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* --- TYPOGRAPHY & COMMON --- */
    h1, h2, h3, h4, .font-serif {
      font-family: var(--font-serif);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .section-title span {
      color: var(--gold-primary);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 4px;
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }

    .section-title h2 {
      font-size: 2.8rem;
      font-weight: 400;
      color: var(--text-light);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 2rem;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .btn-gold {
      background-color: var(--gold-primary);
      color: var(--bg-dark);
      border-color: var(--gold-primary);
    }

    .btn-gold:hover {
      background-color: var(--gold-light);
      border-color: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
    }

    .btn-outline {
      background: transparent;
      color: var(--gold-primary);
      border-color: var(--gold-primary);
    }

    .btn-outline:hover {
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      transform: translateY(-2px);
    }

    /* --- NAVBAR --- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 1.5rem 0;
      transition: var(--transition);
      background: linear-gradient(to bottom, rgba(18, 16, 14, 0.9), transparent);
    }

    .navbar.scrolled {
      background: rgba(18, 16, 14, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo span {
      color: var(--gold-primary);
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: var(--transition);
      position: relative;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--gold-primary);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background-color: var(--gold-primary);
      transition: var(--transition);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .cart-trigger {
      position: relative;
      background: transparent;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      transition: var(--transition);
    }

    .cart-trigger:hover {
      color: var(--gold-primary);
    }

    .cart-badge {
      position: absolute;
      top: 0;
      right: 0;
      background-color: var(--gold-primary);
      color: var(--bg-dark);
      font-size: 0.7rem;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- HERO SECTION --- */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(18, 16, 14, 0.6), rgba(18, 16, 14, 0.8)), 
                  url('https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&q=80&w=2000') center/cover no-repeat;
      text-align: center;
      padding-top: 80px;
    }

    .hero-content {
      max-width: 850px;
      padding: 0 1.5rem;
      animation: fadeIn 1.2s ease-out;
    }

    .hero-subtitle {
      color: var(--gold-primary);
      font-size: 1rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .hero h1 {
      font-size: 4rem;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      color: var(--text-light);
    }

    .hero h1 em {
      font-style: italic;
      color: var(--gold-light);
    }

    .hero-description {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* --- FEATURES BADGES --- */
    .features-bar {
      background: var(--bg-card);
      padding: 2.5rem 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
      text-align: center;
    }

    .feature-item {
      display: flex;
